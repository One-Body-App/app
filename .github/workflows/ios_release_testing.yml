name: build ios app for testing
on:
  push:
    branches:
      - 'staging'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    permissions:
      contents: write # Required only to record the release version bump.
    runs-on: macos-15
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ github.token }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'yarn'
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          bundler-cache: true
      - name: 'Create env file'
        env:
          BUILD_ENV_VARS: ${{ vars.ENV_VARS }}
          BUILD_ENV_SECRETS: ${{ secrets.ENV_SECRET_VARS }}
        run: |
          umask 077
          printf '%s\n%s\n' "$BUILD_ENV_VARS" "$BUILD_ENV_SECRETS" > .env
      - run: yarn install --immutable
      - run: bundle install
      - run: bundle exec fastlane ios beta
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ vars.MATCH_GIT_URL }}
      - uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          file_pattern: 'ios/onebody.xcodeproj/project.pbxproj ios/onebody/Info.plist android/app/build.gradle'
          commit_message: 'chore: bump ios version for testing [skip ci]'
