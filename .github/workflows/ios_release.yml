name: build-ios-app
on:
  push:
    branches:
      - 'staging'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-13
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v2
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'yarn'
      - uses: actions/cache@v2
        with:
          path: ios/vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('ios/**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-ios-gems-
      - name: 'Create env file'
        run: |
          echo "${{ vars.ENV_VARS }}" > .env
          cat .env
          echo "${{ secrets.ENV_SECRET_VARS }}" > .env
      - run: yarn install
      - run: cd ios && bundle install
      - run: cd ios && bundle exec fastlane ios beta
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ vars.MATCH_GIT_URL }}
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Bump version [skip ci]
