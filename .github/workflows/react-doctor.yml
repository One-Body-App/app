name: React Doctor

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: millionco/react-doctor@84ad0c8d0df7a3ab7d26946367fae3bc39c100d0 # reviewed main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          diff: main
